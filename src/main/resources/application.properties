spring.application.name=diego-web2-fullstack
spring.datasource.url=jdbc:h2:file:./data/database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.data.rest.detection-strategy=annotated
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Configure SMTP por variáveis de ambiente; não grave credenciais no repositório.
nexus.email.enabled=${NEXUS_EMAIL_ENABLED:false}
nexus.email.from=${NEXUS_EMAIL_FROM:}
nexus.frontend-url=${NEXUS_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sessão autenticada; acesso local por padrão.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
